services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenthub-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # ⚠️ Copia .env.example como .env y configura ENCRYPTION_KEY antes de ejecutar
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=./data/agenthub.db
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?⚠️  Define ENCRYPTION_KEY en un archivo .env en la raíz del proyecto}
    volumes:
      - agenthub-db-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenthub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  agenthub-db-data:
    driver: local
