# ─────────────────────────────────────────────────────────────────────────────
# NEXORA — Entorno Docker para Desarrollo Local
# ⚠️ ADVERTENCIA ZERO-TRUST:
# Esta configuración de docker-compose está diseñada EXCLUSIVAMENTE para desarrollo local.
# Para despliegues en producción corporativos, se requiere un Reverse Proxy con terminación
# TLS/HTTPS (Nginx/Traefik/Cloudflare), autenticación JWT obligatoria en todas las rutas
# y aislamiento de red sin exposición de puertos administrativos sin cifrar.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=./data/nexora.db
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?⚠️  Define ENCRYPTION_KEY en un archivo .env en la raíz del proyecto}
      - JWT_SECRET=${JWT_SECRET:?⚠️  Define JWT_SECRET en un archivo .env en la raíz del proyecto}
    volumes:
      - nexora-db-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

volumes:
  nexora-db-data:
    driver: local
